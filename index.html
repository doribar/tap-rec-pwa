<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#111827"><meta name="description" content="画面全体をタップして録音・再生"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><title>TAP REC</title><style>
:root{font-family:system-ui,"Noto Sans JP",sans-serif;color:#fff;color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;height:100%;overscroll-behavior:none}button{font:inherit}#tap{position:fixed;inset:0;width:100%;height:100%;min-height:100dvh;border:0;color:inherit;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:max(28px,env(safe-area-inset-top)) 20px max(30px,env(safe-area-inset-bottom));background:linear-gradient(160deg,var(--a),#101727);touch-action:manipulation;cursor:pointer;-webkit-tap-highlight-color:transparent}#tap:disabled{opacity:1}#tap:focus-visible{outline:3px solid white;outline-offset:-5px}body{--a:#253554;--c:#b7c8ff}body[data-s=recording]{--a:#80263e;--c:#ff9eab}body[data-s=starting],body[data-s=stopping]{--a:#593043;--c:#ffb3c1}body[data-s=ready]{--a:#185950;--c:#9df6d5}body[data-s=playing]{--a:#17578b;--c:#94d5ff}body[data-s=paused]{--a:#64502b;--c:#ffe1a3}body[data-s=ended]{--a:#513879;--c:#dabfff}.top,.bottom{width:100%;display:flex;justify-content:space-between;align-items:center;gap:15px;color:#ccd5e5;font-size:12px}.brand{font-weight:850;letter-spacing:.22em;color:#fff}.pill{border:1px solid #ffffff35;border-radius:99px;padding:8px 13px}.main{display:flex;flex-direction:column;align-items:center;text-align:center;width:100%}.ring{width:min(44vw,188px);height:min(44vw,188px);border:1px solid #ffffff30;background:#ffffff10;box-shadow:0 0 0 19px #ffffff06,0 0 0 39px #ffffff04;border-radius:50%;display:grid;place-items:center;margin-bottom:36px}.ring svg{width:43%;height:43%;stroke:var(--c);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.time{font-size:clamp(56px,15vw,88px);font-weight:750;letter-spacing:-.06em;font-variant-numeric:tabular-nums}.status{font-size:25px;font-weight:750;margin-top:12px}.hint{font-size:15px;color:#d4dce9;margin-top:12px}.meter{margin-top:34px;width:min(260px,70vw);height:3px;background:#ffffff25;border-radius:5px;overflow:hidden}.fill{width:0;height:100%;background:var(--c)}.notice{max-width:330px;font-size:13px;line-height:1.6;background:#0005;border-radius:12px;padding:12px;margin-top:20px}.notice:empty{display:none}body[data-s=recording] .ring{animation:pulse 1.6s ease-in-out infinite}@keyframes pulse{50%{transform:scale(1.06)}}@media(max-height:570px){.ring{height:20vh;width:20vh;margin-bottom:10px}.time{font-size:52px}.meter{margin-top:12px}.status{margin-top:4px}.hint{margin-top:5px}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body data-s="starting"><button id="tap" disabled aria-label="読み込み中"><span class="top"><span class="brand">● TAP REC</span><span class="pill" id="mode">準備中</span></span><span class="main"><span class="ring"><svg id="symbol" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="13" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3m-4 0h8"/></svg></span><span class="time" id="clock">00:00</span><span class="status" id="status">準備中</span><span class="hint" id="hint">読み込み中</span><span class="meter"><span class="fill" id="fill"></span></span><span class="notice" id="notice" role="status"></span></span><span class="bottom"><span>音声は端末内だけで処理</span><span>画面全体をタップ</span></span></button><script type="module" src="./app.js"></script></body></html>
